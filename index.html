<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=done_outline"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap"
          rel="stylesheet">
    <script src="https://kit.fontawesome.com/712e3d27a2.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="src/assets/favicon.png" />
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="src/style.css"/>
    <title>Demo viem For Devs</title>
</head>
<body>
<nav class="header">
    <h1>
        <span class="title-text">SEISMIC PRIVACY PLAYGROUND</span>
        <span class="demo-badge">DEV DEMO</span>
    </h1>
    <div class="wallet-menu-container">
        <button id="connectWallet">Connect Wallet</button>
        <div id="walletDropdown" class="dropdown-box" >
            <div class="key-row">
                <span>Address: <span id="lbl-address"></span></span>
                <i class="fa-regular fa-copy copy-icon" data-clipboard="address" title="Copy Address"></i>
            </div>
            <div class="key-row">
                <span>Public Key: <span id="lbl-pub"></span></span>
                <i class="fa-regular fa-copy copy-icon" data-clipboard="pub" title="Copy Public Key"></i>
            </div>
            <div class="key-row">
                <span>Private Key: <span id="lbl-prv"></span></span>
                <i class="fa-regular fa-copy copy-icon" data-clipboard="prv" title="Copy Private Key"></i>
            </div>
            <button id="disconnectBtn">
                <i class="fa-solid fa-power-off"></i> Disconnect
            </button>
        </div>
    </div>

</nav>
<div id="profile" style="display: none" >
    <div id="prv-key-field" ><label>
        <input type="text" placeholder="enter private key"><button>Import</button>
    </label></div>
    <div id="prv-gen-field"><button>Generate</button></div>
    <div id="portfo-btn"><button>portfolio</button></div>
    <div id="faucet"><button>Faucet<i class="fa-solid fa-droplet"></i></button></div>
</div>

<div id="logs">
    <div id="log-messages">
    </div>
</div>

<div class="container">
    <div>
        <label class="toggle-switch">
            <input type="checkbox" id="myToggle" placeholder="deposit"/>
            <span class="slider"></span>
        </label>
        <label for="inputField"></label>
        <input type="text" id="inputField" placeholder="Enter something ..."/>
        <button id="submitButton">Submit</button>
    </div>
</div>

<div id="portfo" style="display: none">
    <div id="pub-container">
        <div id="pub-title"><p>public messages</p></div>
        <div id="pub-portfo">

        </div>

    </div>
    <div id="prv-container">
        <div id="prv-title"><p>private messages</p></div>
        <div id="prv-portfo">

        </div>
    </div>
</div>


<div id="view-box" style="display: none;">
    <div class="view-header">
        <h3>Message Details</h3>
    </div>
    <div class="view-content">
        <p id="view-message-text">Message content will appear here...</p>
    </div>
    <button id="doneReadingBtn" class="done-btn">Done reading</button>
</div>


<footer class="cyber-footer">
    <p>Built by <span class="creator-name">0XSHAH</span></p>
    <div class="social-icons">
        <a href="https://twitter.com/OX_SHAH" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="https://discordapp.com/users/763319059843776532" target="_blank"><i
                class="fa-brands fa-discord"></i></a>
        <a href="https://t.me/OXSHAH" target="_blank"><i class="fa-brands fa-telegram"></i></a>
    </div>
</footer>

<script type="module" src="src/app.ts"></script>
</body>
</html>
